<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fondo con gradiente -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Icono de imagen (house/building) -->
  <g transform="translate(400, 300)">
    <!-- Casa simple -->
    <path d="M -80 0 L -80 80 L 80 80 L 80 0 L 0 -60 Z"
          fill="none"
          stroke="#64748b"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Ventanas -->
    <rect x="-50" y="20" width="30" height="30" fill="#64748b" opacity="0.6"/>
    <rect x="20" y="20" width="30" height="30" fill="#64748b" opacity="0.6"/>

    <!-- Puerta -->
    <rect x="-15" y="40" width="30" height="40" fill="#64748b" opacity="0.8"/>
  </g>

  <!-- Texto -->
  <text x="400" y="450"
        font-family="Arial, sans-serif"
        font-size="18"
        fill="#94a3b8"
        text-anchor="middle">
    Imagen no disponible
  </text>
</svg>
